name: neonecy_team_app
description: NEONECY TEAM APP — Premium CRM for NEONECY
publish_to: 'none'
version: 1.0.1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  go_router: ^13.0.0
  provider: ^6.1.1
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  package_info_plus: ^8.0.0
  flutter_dotenv: ^5.1.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  firebase_analytics: ^12.6.0
  firebase_crashlytics: ^5.4.0
  flutter_local_notifications: ^22.3.1
  permission_handler: ^11.3.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/logos/
    - assets/others/
