name: neonecy_team_app
description: NEONECY TEAM APP — Premium CRM for NEONECY
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  go_router: ^13.0.0
  provider: ^6.1.1
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  crypto: ^3.0.7
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  path_provider: ^2.1.6
  package_info_plus: ^8.0.0
  flutter_dotenv: ^5.1.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  firebase_analytics: ^12.6.0
  firebase_crashlytics: ^5.4.0
  flutter_local_notifications: ^22.3.1
  permission_handler: ^11.3.1
  url_launcher: ^6.3.3
  internet_connection_checker_plus: ^3.1.2
  lottie: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/logos/NEC app icon — Rounded — 512 × 512.png
    - assets/logos/NEC app icon — Rounded — 1024 × 1024.png
    - assets/others/login-banner.png
    - assets/others/Free no internet Animation  new.json
