dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  go_router: ^13.0.0
  provider: ^6.1.1
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  http: ^1.6.0
  http_parser: ^4.1.2
  crypto: ^3.0.7
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  file_picker: ^8.1.2
